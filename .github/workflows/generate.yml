name: Generate content (optional Ollama endpoint)
on:
  workflow_dispatch:
    inputs:
      count: {description: 'Items (up to remaining daily allowance)', required: true, default: '1', type: string}
      destination: {description: 'Optional destination', required: false, type: string}
      language: {description: 'English, Hindi, or Marathi', required: true, default: 'English', type: choice, options: [English, Hindi, Marathi]}
permissions:
  contents: write
concurrency:
  group: tapsroute-state-writer
  cancel-in-progress: false
jobs:
  generate:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate and persist allowance even when provider fails
        run: |
          set +e
          PYTHONPATH=src python -m tapsroute.cli generate --count "$COUNT" --language "$LANGUAGE"
          result=$?
          PYTHONPATH=src python -m tapsroute.dashboard
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add data/state.json data/dashboard.json
          git diff --cached --quiet || (git commit -m 'Record content generation attempt' && git push)
          exit "$result"
        env:
          COUNT: ${{ inputs.count }}
          LANGUAGE: ${{ inputs.language }}
          DESTINATION: ${{ inputs.destination }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:3b' }}
